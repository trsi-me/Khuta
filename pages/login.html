<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - خطة</title>
    <link rel="icon" type="image/x-icon" href="../assets/images/Icon.ico">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">
                <img src="../assets/images/Logo.png" alt="خطة">
                <h1>خطة</h1>
            </div>
            <h2>تسجيل الدخول</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div id="loginError" class="error-message" style="display: none;"></div>
                <button type="submit" class="btn btn-primary btn-block">تسجيل الدخول</button>
            </form>
            <div class="login-info">
                <p>بيانات الدخول الافتراضية:</p>
                <p><strong>أدمن:</strong> admin@khuta.com / password</p>
                <p><strong>رئيس اللجنة:</strong> head.cs@khuta.com / password</p>
                <p><strong>عضو هيئة تدريس:</strong> faculty@khuta.com / password</p>
                <p><strong>رئيس القسم:</strong> dept.cs@khuta.com / password</p>
            </div>
        </div>
    </div>
    <script src="../assets/js/script.js"></script>
    <script>
        if (window.location.pathname.includes('login.html')) {
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const errorDiv = document.getElementById('loginError');
                
                try {
                    const formData = new FormData();
                    formData.append('email', email);
                    formData.append('password', password);
                    
                    const response = await fetch('../php/login.php', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        window.location.href = '../index.html';
                    } else {
                        errorDiv.textContent = data.error || 'فشل تسجيل الدخول';
                        errorDiv.style.display = 'block';
                    }
                } catch (error) {
                    errorDiv.textContent = 'حدث خطأ أثناء الاتصال';
                    errorDiv.style.display = 'block';
                }
            });
        }
    </script>
</body>
</html>
